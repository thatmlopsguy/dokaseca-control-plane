exclude: "^(third_party/.*)"
update:
    cooldown_days: 7
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: mixed-line-ending
        args: [--fix=lf]
    -   id: forbid-new-submodules
    -   id: check-vcs-permalinks
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: check-added-large-files
        args: ["--maxkb=2000"]
    -   id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
    -   id: detect-private-key
-   repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
    -   id: shellcheck
        name: shellcheck
        args: ["--rcfile=.shellcheckrc"]
        files: ^scripts/.*\.sh$
# -   repo: https://github.com/jumanjihouse/pre-commit-hooks
#     rev: 3.0.0
#     hooks:
#     -   id: shfmt
#         args: ['-l', '-i', '2', '-ci', '-sr', '-w']
-   repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
    -   id: bashate
        name: bashate
        args: ["--ignore=E002,E003,E006"]
        files: ^scripts/.*\.sh$
-   repo: https://github.com/bridgecrewio/checkov
    rev: "3.3.26"
    hooks:
    -   id: checkov
        name: checkov
-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
    -   id: commitizen
        stages: [commit-msg]
-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
    -   id: zizmor
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
        name: actionlint
        description: Lint GitHub Actions workflow files
        files: ^\.github/workflows/.*\.ya?ml$
        # actionlint 1.7.12 rejects GitHub's `$/` self-repository syntax
        exclude: ^\.github/workflows/pre-commit-autoupdate\.yml$
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
        args: ["--ignore-words", ".codespell-ignore"]
        exclude: ".*\\.svg$"
-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "0.38.2"
    hooks:
    -   id: check-github-workflows
    -   id: check-dependabot
    -   id: check-github-actions
-   repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
    -   id: markdownlint
        exclude: "(\\.github/PULL_REQUEST_TEMPLATE\\.md|CODE_OF_CONDUCT\\.md)"
-   repo: https://github.com/betterleaks/betterleaks
    rev: v2.0.0-rc.2
    hooks:
    -   id: betterleaks
        args: ["--config=.betterleaks.toml"]
-   repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
    -   id: validate-pyproject
-   repo: local
    hooks:
    -   id: suggestion
        name: Suggestion
        entry: bash -c 'echo "To bypass all the pre-commit hooks, add
          --no-verify to git commit. To skip a specific hook, prefix the commit
          command with SKIP=<hook-id>."'
        language: system
        verbose: true
        pass_filenames: false
