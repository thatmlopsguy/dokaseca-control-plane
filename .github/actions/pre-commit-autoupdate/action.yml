name: 'Pre-commit update'
description: 'Run prek update'
branding:
  icon: chevrons-up
  color: yellow
runs:
  using: "composite"
  steps:
    - name: Run prek
      uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
      with:
        extra-args: "update"
        prek-version: "0.5.5"
