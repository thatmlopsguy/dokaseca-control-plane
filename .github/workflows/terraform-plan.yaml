name: "Terraform Plan Standalone"

on:
  pull_request:
    branches: ["main"]
    paths:
      - "terraform/topologies/standalone/**"
      - "terraform/modules/**"
      - ".terraform-docs.yml"
      - ".tflint.hcl"

    # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  terraform:
    environment: ci
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    # strategy:
    #   fail-fast: false

    name: "Terraform Plan Standalone"
    runs-on: ubuntu-latest
    env:
      TF_VAR_vault_token: ${{ secrets.TF_VAR_VAULT_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Fetch full history for better diffs
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.1"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/topologies/standalone
        run: terraform init -upgrade

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Terraform Plan
        working-directory: terraform/topologies/standalone
        run: terraform plan -out=tfplan.binary

      - name: Terraform Show Plan
        working-directory: terraform/topologies/standalone
        run: terraform show -no-color tfplan.binary

      - name: Terraform Apply (Cluster First)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/topologies/standalone
        run: |
          # Apply cluster first to create kubeconfig (works for kind or vind)
          terraform apply -auto-approve -target=module.kind_cluster -target=module.vind_cluster

      - name: Terraform Apply (Full)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/topologies/standalone
        run: |
          # Now apply remaining resources with kubeconfig available
          terraform apply -auto-approve

      - name: Verify Cluster
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/topologies/standalone
        run: |
          kind get clusters
          kubectl get nodes --kubeconfig ../../../kubeconfigs/standalone/dev
          kubectl get namespaces --kubeconfig ../../../kubeconfigs/standalone/dev

      - name: Cleanup Kind Cluster
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/topologies/standalone
        run: terraform destroy -auto-approve || true
