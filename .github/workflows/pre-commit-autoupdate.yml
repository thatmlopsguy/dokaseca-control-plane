name: Pre-commit auto-update

on:
  # every month on the first day at midnight
  # https://crontab.guru/#0_0_1_*_*
  schedule:
    - cron: "0 0 1 * *"
  # on demand
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: ubuntu-slim
    environment: ci
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: "0.5.10"
          install-only: true

      - name: Run prek update
        run: prek update
        shell: bash

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: always()
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: update/pre-commit-hooks
          title: "ci: update pre-commit hooks"
          commit-message: "ci: update pre-commit hooks"
          body: Update versions of pre-commit hooks to latest version.
