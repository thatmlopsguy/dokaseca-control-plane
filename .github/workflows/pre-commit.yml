name: PrekChecks

on:
  push:
    branches: [main, develop]
    paths:
      - "**.sh"
      - "**.py"
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.md"
      - ".pre-commit-config.yaml"
      - ".shellcheckrc"
      - "scripts/**"
      - "terraform/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "**.sh"
      - "**.py"
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.md"
      - ".pre-commit-config.yaml"
      - ".shellcheckrc"
      - "scripts/**"
      - "terraform/**"

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history for better diffs
          persist-credentials: false

      - name: Install system dependencies
        run: |
          # Install shellcheck
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Run prek
        uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          extra-args: "--all-files"
          prek-version: "0.5.5"
