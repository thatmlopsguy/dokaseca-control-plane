name: Pre-commit Checks

on:
  push:
    branches: [main, develop]
    paths:
      - "**.sh"
      - "**.py"
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.md"
      - ".pre-commit-config.yaml"
      - ".shellcheckrc"
      - "requirements/**"
      - "scripts/**"
      - "terraform/**"

  pull_request:
    branches: [main, develop]
    paths:
      - "**.sh"
      - "**.py"
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.md"
      - ".pre-commit-config.yaml"
      - ".shellcheckrc"
      - "requirements/**"
      - "scripts/**"
      - "terraform/**"

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: GitHubSecurityLab/actions-permissions/monitor@b25f731bf2f9eb9748c2e9757d366c3e72fa2109 # v1.0.2-beta8

      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0 # Fetch full history for better diffs
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Cache pre-commit dependencies
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          # Install shellcheck
          sudo apt-get update
          sudo apt-get install -y shellcheck

          # # Install terraform for terraform-docs hook
          # wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          # echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          # sudo apt-get update
          # sudo apt-get install -y terraform

          # # Install terraform-docs
          # curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.17.0/terraform-docs-v0.17.0-$(uname)-amd64.tar.gz
          # tar -xzf terraform-docs.tar.gz
          # chmod +x terraform-docs
          # sudo mv terraform-docs /usr/local/bin/
          # rm terraform-docs.tar.gz

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Upload pre-commit cache
        if: failure()
        uses: actions/cache/save@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}-${{ github.run_id }}
