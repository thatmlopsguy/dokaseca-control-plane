## Doka Seca common variables
##
## Based on:
##  - https://raw.githubusercontent.com/reportportal/reportportal/master/docker-compose.yml
##  - https://github.com/langfuse/oss-llmops-stack/blob/main/docker-compose/docker-compose.yml
##  - https://github.com/rustfs/rustfs/blob/main/docker-compose.yml
##
## @section Deployment Profiles
##
## The following profiles can be used to control which services are launched:
##
## - infra: Infrastructure dependencies (e.g., database, message broker, gateway)
## - optional: typically used for optional or internal services
## - database: database services (PostgreSQL, MySQL,MongoDB, ClickHouse)
## - storage: object storage services (MinIO, rustfs)
## - monitoring: monitoring stack (Prometheus, Grafana), dozzle
## - messaging: messaging services (RabbitMQ, Redis)
## By default, only the 'infra' profile is active, which includes essential infrastructure services.
##
## To launch all services, use:
##   docker compose --profile infra --profile optional --profile database
##
## @section Logging configuration
## @param x-logging Shared logging configuration for all services
## - Uses json-file logging driver with rotation
##
x-logging: &logging
  driver: "json-file"
  options:
    max-size: 100m
    max-file: "5"

services:
  ##
  ## Doka Seca dependencies
  ## @section Doka Seca dependencies
  ##

  ## @param portainer Web-based Docker management UI for monitoring and managing containers, images, volumes, and networks
  ## - Exposes port 9000 for accessing the Portainer dashboard
  ## - Uses Docker socket for direct communication with the Docker daemon
  ## https://docs.portainer.io/start/install-ce/server/docker/linux#docker-compose
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.38.0
    command: -H unix:///var/run/docker.sock
    ports:
      - "9002:9000"
    environment:
      - ADMIN_USERNAME=${PORTAINER_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${PORTAINER_ADMIN_PASSWORD:-admin_password}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped
    profiles:
      - optional
    networks:
      - kind

  ## @param atlantis Terraform pull request automation tool for infrastructure as code management
  ## - Listens for GitHub webhooks to trigger Terraform plan/apply workflows
  ## - Exposes port 4141 for webhook communication
  ## - Requires GitHub user and token for authentication and repository access
  ## See also Terrapod https://github.com/mattrobinsonsre/terrapod
  ##
  atlantis:
    image: runatlantis/atlantis:latest
    container_name: atlantis
    ports:
      - "4141:4141"
    environment:
      - ATLANTIS_GH_USER=atlantis
      - ATLANTIS_GH_TOKEN
    profiles:
      - optional
    restart: unless-stopped
    networks:
      - kind

  ## @param vault Secret management server for storing sensitive configuration and credentials
  ## - Runs in development mode for simplicity, not recommended for production use
  ## - Exposes default Vault port 8200 for internal communication
  ##
  vault:
    image: hashicorp/vault:1.21
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID:-root} # For development only, do not use in production
    cap_add:
      - IPC_LOCK
    command: server -dev
      # For development only, do not use in production
      # For production, use a proper storage backend and configuration file
      # command: server -config=/vault/config/config.hcl
    # volumes:
    #   - vault-data:/vault/file
    #   - vault-logs:/vault/logs
    #   - ./docker/vault:/vault/config
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  ## @param postgres Relational database server for structured data storage
  ## - Uses official PostgreSQL image with version 16
  ## - Exposes default PostgreSQL port 5432 for internal communication
  ## - Includes healthcheck to ensure database is ready before dependent services start
  ##
  postgres:
    image: postgres:16
    container_name: postgres
    logging:
      <<: *logging
    shm_size: "512m"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres_password}
      POSTGRES_USER: ${PG_USER:-postgres}
    ## Uncomment to expose PostgreSQL externally
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
      - database
    networks:
      - kind

  pgadmin:
    image: dpage/pgadmin4:9.12.0
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - optional
      - database
    networks:
      - kind

  ## MySQL/MariaDB database for services that require relational storage with MySQL compatibility
  ## - Exposes default MySQL port 3306 for internal communication
  ## - Includes healthcheck to ensure MySQL is ready before dependent services start
  ##
  mysql:
    image: mysql:8.0.45-debian
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devlake}
      MYSQL_USER: ${MYSQL_USER:-devlake_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devlake_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
      - database
    networks:
      - kind

  ## MongoDB NoSQL database for services that require flexible schema or document storage
  ## - Exposes default MongoDB port 27017 for internal communication
  ## - Includes Mongo Express web UI for database management and monitoring
  ##
  mongodb:
    image: mongo:8.2.6-noble
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo}
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    profiles:
      - infra
      - database
    networks:
      - kind

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo}:${MONGO_\
        INITDB_ROOT_PASSWORD:-mongo}@mongodb:27017/"
      ME_CONFIG_MONGODB_AUTH_DATABASE: "admin"
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_WEB_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_WEB_PASSWORD:-password}
    depends_on:
      - mongodb
    restart: unless-stopped
    profiles:
      - infra
      - database
    networks:
      - kind

  ## @param clickhouse Columnar database for analytics and time-series data storage
  ## - Exposes HTTP interface on port 8123 and native client interface on port 9000 for internal communication
  ## - Includes healthcheck to ensure ClickHouse is ready before dependent services start
  ##
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.20
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9009:9000" # Native client interface
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always
    profiles:
      - infra
      - database
    networks:
      - kind

  ## @param keycloak Open-source identity and access management server
  ## - Provides authentication and authorization for Doka Seca services
  ## - Supports multiple protocols (OAuth2, OpenID Connect, SAML)
  ##
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak_user}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_password}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
    ports:
      - "8080:8080"
      - "8443:8443"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  ## @param minio Object storage server compatible with Amazon S3
  ## - Used for storing artifacts, logs, and other large files
  ## - Provides a web console for management and monitoring
  ## - For production, consider using a proper storage backend and configuration
  ##
  minio:
    # new version the admin features are removed
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioAccessKey
      MINIO_ROOT_PASSWORD: minioSecretKey
    command: [ "server", "--console-address", ":9001", "/data" ]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
      - storage
    networks:
      - kind

  bucket-creator:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bucket-creator
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER
      $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/velero && mc mb
      --ignore-existing local/loki && mc mb --ignore-existing local/tempo && mc
      mb --ignore-existing local/victoriametrics && mc mb --ignore-existing
      local/victorialogs && mc mb --ignore-existing local/victoriatraces && mc
      mb --ignore-existing local/reportportal && mc mb --ignore-existing
      local/mlflow && mc mb --ignore-existing local/langfuse && mc mb
      --ignore-existing local/harbor && mc mb --ignore-existing
      local/chartmuseum && mc mb --ignore-existing local/argoworkflows && mc mb
      --ignore-existing local/pyroscope"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioAccessKey}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioSecretKey}
    restart: "no"
    profiles:
      - infra
      - storage
    networks:
      - kind

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9080:9000" # S3 API port
      - "9081:9001" # Console port
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfssecret}
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - rustfs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f
            http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
      - storage
    networks:
      - kind

  ## @param dozzle Web-based Docker log viewer for real-time monitoring of container logs
  dozzle:
    image: amir20/dozzle:v10.5.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
      - 8085:8080
    environment:
      - DOZZLE_HOSTNAME=doka-seca
    profiles:
      - optional
      - monitoring
    restart: unless-stopped
    networks:
      - kind

  ## @param  prometheus Open-source monitoring and alerting toolkit for collecting and querying metrics
  ## - Exposes port 9090 for Prometheus web UI and API
  ##
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
    profiles:
      - optional
      - monitoring
    restart: unless-stopped
    networks:
      - spoke-dev-control-plane

  ## @param grafana Open-source analytics and monitoring platform for visualizing metrics collected by Prometheus
  ## - Exposes port 3000 for Grafana web UI
  ## - Configured to connect to Prometheus as a data source and load predefined dashboards
  ##
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    volumes:
      - ./docker/grafana/provisioning/dashboards/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - optional
      - monitoring
    networks:
      - kind

  ## @param redis In-memory data structure store used for caching, session management
  ## and message brokering
  ##
  redis:
    image: redis:8.4.0
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
      - messaging
    networks:
      - kind

  redisinsight:
    image: redislabs/redisinsight:3.0
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - optional
      - messaging
    networks:
      - kind

  ## @param rabbitmq Asynchronous message broker for inter-service communication
  ## - Includes optional plugins for dashboard, LDAP, shovel, etc.
  ##
  rabbitmq:
    image: bitnamilegacy/rabbitmq:4.1.2-debian-12-r1
    container_name: rabbitmq
    logging:
      <<: *logging
    # ports:
    ## Uncomment to expose AMQP protocol port
    #   - "5672:5672"
    ## Uncomment to expose RabbitMQ dashboard
    #   - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitmq_password}
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "true"
      ## Block all procedures when free disk space is less than 50MB
      ## Ref: https://www.rabbitmq.com/docs/disk-alarms
      RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT: 50MB
      RABBITMQ_PLUGINS: >
        rabbitmq_consistent_hash_exchange rabbitmq_management
        rabbitmq_auth_backend_ldap rabbitmq_shovel rabbitmq_shovel_management
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    profiles:
      - optional # Messaging is optional for now
      - messaging
    networks:
      - kind

## @section Volumes
## Named volumes for persistent data storage
##
## @param storage Shared volume for Doka Seca services that require file storage
##
## For custom host path, replace 'storage:' with a bind mount:
##   - ./data/storage:/data/storage
##
volumes:
  vault-data:
  vault-logs:
  postgres-data:
  pgadmin-data:
  mysql-data:
  mongodb-data:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:
  portainer-data:
  redis-data:
  redis-insight:
  minio-data:
  rustfs-data:
  dozzle-data:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ./data/minio
    ## @section Networks
    ## Custom Docker network for Doka Seca service discovery
    ##
networks:
  kind:
    external: true
