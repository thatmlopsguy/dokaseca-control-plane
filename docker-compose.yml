## Doka Seca common variables
##
## Based on https://raw.githubusercontent.com/reportportal/reportportal/master/docker-compose.yml

## @section Deployment Profiles
##
## The following profiles can be used to control which services are launched:
##
## - infra: Infrastructure dependencies (e.g., database, message broker, gateway)
## - optional: typically used for optional or internal services
##

## @section Logging configuration
## @param x-logging Shared logging configuration for all services
## - Uses json-file logging driver with rotation
##
x-logging: &logging
  driver: "json-file"
  options:
    max-size: 100m
    max-file: "5"

## @section Database configuration
## @param x-database Shared database connection settings used across services
## @param db_host Internal hostname of the database container (e.g., "postgres")
## @param db_port Port used to connect to the database (default: 5432)
## @param db_user Username for service-level access to the database
## @param db_password Password for the specified DB user
## @param db_name Logical database name used by services
##
x-database:
  db_host: &db_host postgres
  db_port: &db_port 5432
  db_user: &db_user ${POSTGRES_USER-rpuser}
  db_password: &db_password ${POSTGRES_PASSWORD-rppass}
  db_name: &db_name ${POSTGRES_DB-reportportal}

## @section AMQP (RabbitMQ) configuration
## @param x-amqp Shared message broker settings used for internal service communication
## @param rabbitmq_host Hostname of the RabbitMQ container (Docker internal DNS)
## @param rabbitmq_port Port for AMQP protocol communication (default: 5672)
## @param rabbitmq_apiport Port to access RabbitMQ web UI (default: 15672)
## @param rabbitmq_user Username for authenticating RabbitMQ clients
## @param rabbitmq_password Password for the RabbitMQ user
##
x-amqp:
  rabbitmq_host: &rabbitmq_host rabbitmq
  rabbitmq_port: &rabbitmq_port 5672
  rabbitmq_apiport: &rabbitmq_apiport 15672
  rabbitmq_user: &rabbitmq_user ${RABBITMQ_DEFAULT_USER-rabbitmq}
  rabbitmq_password: &rabbitmq_password ${RABBITMQ_DEFAULT_PASS-rabbitmq}

services:
  ##
  ## Doka Seca dependencies
  ## @section Doka Seca dependencies
  ##
  # https://docs.portainer.io/start/install-ce/server/docker/linux#docker-compose
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.38.0
    command: -H unix:///var/run/docker.sock
    ports:
      - "9002:9000"
    environment:
      - ADMIN_USERNAME=username
      - ADMIN_PASSWORD=password
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped
    profiles:
      - optional
    networks:
      - kind

  vault:
    image: hashicorp/vault:1.21
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_DEV_ROOT_TOKEN_ID=root # For development only, do not use in production
    cap_add:
      - IPC_LOCK
    command:
      server -dev # For development only, do not use in production
      # For production, use a proper storage backend and configuration file
      # command: server -config=/vault/config/config.hcl
    # volumes:
    #   - vault-data:/vault/file
    #   - vault-logs:/vault/logs
    #   - ./docker/vault:/vault/config
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  postgres:
    image: postgres:16
    container_name: postgres
    logging:
      <<: *logging
    shm_size: "512m"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres_password}
      POSTGRES_USER: ${PG_USER:-postgres}
    ## Uncomment to expose PostgreSQL externally
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  pgadmin:
    image: dpage/pgadmin4:9.12.0
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - optional
    networks:
      - kind

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_password}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
    ports:
      - "8080:8080"
      - "8443:8443"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  minio:
    # new version the admin features are removed
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioAccessKey
      MINIO_ROOT_PASSWORD: minioSecretKey
    command: ["server", "--console-address", ":9001", "/data"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra
    networks:
      - kind

  bucket-creator:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bucket-creator
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/velero &&
      mc mb --ignore-existing local/loki &&
      mc mb --ignore-existing local/tempo &&
      mc mb --ignore-existing local/victoria-metrics &&
      mc mb --ignore-existing local/report-portal"
    environment:
      MINIO_ROOT_USER: minioAccessKey
      MINIO_ROOT_PASSWORD: minioSecretKey
    restart: "no"
    profiles:
      - infra
    networks:
      - kind

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
    profiles:
      - optional
    networks:
      - spoke-dev-control-plane

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
    volumes:
      - ./docker/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - optional
    networks:
      - kind
  redis:
    image: redis:8.4.0
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - optional
      - messaging
    networks:
      - kind

  redisinsight:
    image: redislabs/redisinsight:3.0
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - optional
      - messaging
    networks:
      - kind

  ## @param rabbitmq Asynchronous message broker for inter-service communication
  ## - Includes optional plugins for dashboard, LDAP, shovel, etc.
  ##
  rabbitmq:
    image: bitnamilegacy/rabbitmq:4.1.2-debian-12-r1
    container_name: rabbitmq
    logging:
      <<: *logging
    # ports:
    ## Uncomment to expose AMQP protocol port
    #   - "5672:5672"
    ## Uncomment to expose RabbitMQ dashboard
    #   - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq_user
      RABBITMQ_DEFAULT_PASS: *rabbitmq_password
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "true"
      ## Block all procedures when free disk space is less than 50MB
      ## Ref: https://www.rabbitmq.com/docs/disk-alarms
      RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT: 50MB
      RABBITMQ_PLUGINS: >
        rabbitmq_consistent_hash_exchange
        rabbitmq_management
        rabbitmq_auth_backend_ldap
        rabbitmq_shovel
        rabbitmq_shovel_management
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    restart: always
    profiles:
      - messaging
    networks:
      - kind

## @section Volumes
## Named volumes for persistent data storage
##
## @param storage Shared volume for Doka Seca services that require file storage
##
## For custom host path, replace 'storage:' with a bind mount:
##   - ./data/storage:/data/storage
##
volumes:
  vault-data:
  vault-logs:
  postgres-data:
  pgadmin-data:
  grafana-data:
  portainer-data:
  redis-data:
  redis-insight:
  minio-data:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ./data/minio
## @section Networks
## Custom Docker network for Doka Seca service discovery
##
networks:
  kind:
    external: true
