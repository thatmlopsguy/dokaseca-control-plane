# This is NOT the default betterleaks config. The default betterleaks config is located
# here: https://github.com/betterleaks/betterleaks/blob/master/config/betterleaks.toml
# This betterleaks config extends the default config and ignores secrets located in the `cmd/generate/config/rules`

title = "Betterleaks"

[extend]
useDefault = true

[[rules]]
id = "kubernetes-secret-token-base64"
description = "Detect base64 token values in YAML Secret manifests"
regex = '''(?im)^\s*token:\s*([A-Za-z0-9+/]{4,}={0,2})\s*$'''
path = '''(?i)\.(yaml|yml)$'''
secretGroup = 1
keywords = ["token:"]

[[allowlists]]
description = "Ignore Terraform state and Terraform cache paths"
paths = [
	'''^terraform/.*/terraform\.tfstate(\.backup)?$''',
	'''^terraform/.*/terraform\.tfstate\.d/.*$''',
	'''^terraform/.*/\.terraform/.*$''',
]



